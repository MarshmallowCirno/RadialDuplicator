[project]
name = "radial-duplicator"
version = "2.3"
description = "Create radial array, screw or add linked duplicates of selected object and place them radially around the 3D cursor"
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "MarshmallowCirno", email = "marshmallowcirno@gmail.com" },
]
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.39.4",
    "fake-bpy-module>=20260501",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "preserve"

[tool.pyright]
typeCheckingMode = "strict"
reportUnknownMemberType = false
reportMissingModuleSource = false
